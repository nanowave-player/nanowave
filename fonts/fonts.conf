<?xml version="1.0"?>
<!-- this file is only meant for re-building the font cache to this directory -->
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <dir prefix="cwd">./fonts/ttf</dir>
    <cachedir prefix="cwd">./fonts/cache</cachedir>
</fontconfig>

