[package]
name = "nanowave"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
smol = "2.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
clap = { version = "4.6.1", features = ["derive"] }
rodio = { git = "https://github.com/RustAudio/rodio.git", branch="master" }
media_source = { path = "../media_source" }

slint = { version = "1.18.1"}
# slint = { version = "1.18.1", default-features = false, features = ["backend-linuxkms-noseat",  "renderer-software", "compat-1-2"]}


[build-dependencies]
# slint-build = { version = "1.18.1"}
slint-build = { version = "1.18.1", default-features=false, features=[ "renderer-software", "compat-1-18"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
